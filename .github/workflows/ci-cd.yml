name: DevSecOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  ci-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flake8 linter
        run: flake8 app tests

      - name: Run Pytest
        run: python -m pytest -v

  build-scan-push:
    needs: ci-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: |
          echo "IMAGE_NAME=ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.IMAGE_NAME }}:latest .

      - name: Scan image with Trivy
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --format table --exit-code 1 --ignore-unfixed --severity CRITICAL,HIGH ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-scan-push
    runs-on: self-hosted
    steps:
      - name: Set lowercase image name
        shell: powershell
        run: |
          $repo = "${{ github.repository }}".ToLower()
          "IMAGE_NAME=ghcr.io/$repo" | Out-File -FilePath $env:GITHUB_ENV -Encoding ascii -Append

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy container locally
        shell: powershell
        run: |
          $net = docker network ls -q -f "name=^monitoring-net$"
          if (-not $net) {
            docker network create monitoring-net
          }
          $existing = docker ps -aq -f "name=^devops-api$"
          if ($existing) {
            docker stop devops-api
            docker rm devops-api
          }
          docker pull "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker run -d --name devops-api --network monitoring-net --restart unless-stopped -p 8001:8000 "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker image prune -f